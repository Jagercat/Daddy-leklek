    const ConfettiCelebration = () => {
      const confettiColors = ['#FF4081', '#00E5FF', '#FFB300', '#7C4DFF', '#00E676', '#FF6E40'];
      const pieces = useMemo(() => Array.from({ length: 40 }).map((_, i) => ({
        id: i,
        left: Math.random() * 100 + 'vw',
        delay: (Math.random() * 0.8) + 's',
        duration: (2.2 + Math.random() * 1.5) + 's',
        color: confettiColors[i % confettiColors.length],
        size: 8 + Math.random() * 6,
        isCircle: i % 3 === 0,
      })), []);

      return (
        <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9999 }}>
          {pieces.map((p) => (
            <div
              key={p.id}
              className="confetti-piece"
              style={{
                left: p.left,
                width: p.size + 'px',
                height: (p.isCircle ? p.size : p.size * 1.6) + 'px',
                borderRadius: p.isCircle ? '50%' : '2px',
                backgroundColor: p.color,
                animationDelay: p.delay,
                animationDuration: p.duration,

      const calculatePregnancyInfo = (targetDueDate) => {
        if (!targetDueDate) return { week: 5, day: 6, daysUntilDue: 240 };
        const due = new Date(targetDueDate);
        if (isNaN(due.getTime())) return { week: 5, day: 6, daysUntilDue: 240 };

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        due.setHours(0, 0, 0, 0);

        const diffToDue = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        const daysUntilDue = diffToDue > 0 ? diffToDue : 0;

        const lmpDate = new Date(due.getTime() - 280 * 24 * 60 * 60 * 1000);
        const totalDays = Math.floor((today.getTime() - lmpDate.getTime()) / (1000 * 60 * 60 * 24));
        if (totalDays < 0) return { week: 1, day: 1, daysUntilDue };

        const calculatedWeek = Math.min(42, Math.floor(totalDays / 7) + 1);
        const calculatedDay = (totalDays % 7) + 1;
        return { week: calculatedWeek, day: calculatedDay, daysUntilDue };
      };

                          <div onClick={() => toggleExpandItem(item.id)} style={{ flex: 1, display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}>
                            <span style={{ fontSize: 14, color: '#1E293B', textDecoration: isChecked ? 'line-through' : 'none' }}>{item.name}</span>
                            <span style={{ fontSize: 10, color: '#64748B', marginLeft: 6 }}>{isExpanded ? '▲' : '▼'}</span>
                          </div>
                        </div>
                        {isExpanded && (
                          <div style={{ backgroundColor: '#F8FAFC', padding: 10, borderTop: '1px solid #E2E8F0' }}>
                            <div style={{ fontSize: 11, fontWeight: 'bold', color: '#0088A3', marginBottom: 2 }}>💡 用處說明：</div>
                            <div style={{ fontSize: 12, color: '#475569', lineHeight: '17px' }}>{item.usage}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                <button style={{ ...s.actionBtn, marginTop: 12 }} onClick={() => setBagModalVisible(false)}>關閉清單</button>
              </div>
            </div>
          )}

          {settingsModalVisible && (
            <div style={s.modalOverlay} onClick={() => setSettingsModalVisible(false)}>
              <div style={s.weeklyCard} onClick={(e) => e.stopPropagation()}>
                <div style={s.weeklyTitle}>⚙️ 帳號與系統設定</div>
                <div style={{ width: '100%', marginBottom: 15, textAlign: 'left' }}>
                  <div style={{ fontSize: 14, fontWeight: 'bold', color: '#374151' }}>已登入電郵：{email}</div>
                  <div style={{ fontSize: 14, fontWeight: 'bold', color: '#374151', marginTop: 10 }}>預產期設定：</div>
                  {isDueDateModified ? (
                    <div style={s.disabledInputBox}>
                      <div style={{ fontSize: 16, fontWeight: 'bold', color: '#6B7280' }}>{dueDate}</div>
                      <div style={{ fontSize: 12, color: '#D97706', marginTop: 6 }}>⚠️ 預產期已經修改過一次。</div>
                    </div>
                  ) : (
                    <input style={{ ...s.input, marginTop: 6 }} type="tel" value={tempDueDate} onChange={(e) => setTempDueDate(formatDueDateInput(e.target.value))} placeholder="例如：20271015" maxLength={10} />
                  )}
                </div>
                {!isDueDateModified && <button style={s.saveBtn} onClick={handleSaveDueDateInSettings}>確定修改預產期</button>}
                <button style={{ ...s.saveBtn, backgroundColor: '#EF4444', marginTop: 10 }} onClick={() => { setSettingsModalVisible(false); setAppFlow('auth'); }}>登出帳號</button>
                <button style={s.cancelBtn} onClick={() => setSettingsModalVisible(false)}>關閉視窗</button>
              </div>
            </div>
          )}

          {actionModalVisible && (
            <div style={s.modalOverlay} onClick={() => setActionModalVisible(false)}>
              <div style={s.weeklyCard} onClick={(e) => e.stopPropagation()}>
                <div style={{ ...s.weeklyTag, backgroundColor: '#FF4081' }}>每日神隊友行動 🤝</div>
                <div style={s.weeklyTitle}>今日實體互動任務</div>
                <div style={s.actionTaskBox}>
                  <div style={s.actionTaskHeader}>
                    <span style={{ fontSize: 14, fontWeight: 'bold', color: '#1F2937' }}>🧴 幫媽媽用護膚油按摩</span>
                    <span style={{ fontSize: 11, fontWeight: 'bold', color: '#FF4081' }}>+25 XP ⚡ | +10 🪙</span>
                  </div>
                  <button style={{ ...s.actionTaskBtn, backgroundColor: isMassageDone ? '#9CA3AF' : '#FF4081' }} disabled={isMassageDone} onClick={() => { if (!isMassageDone) { addReward(25, 10); setIsMassageDone(true); } }}>
                    {isMassageDone ? '已完成 ✅' : '我已完成按摩 💆🏻‍♀️'}
                  </button>
                </div>
                <div style={s.actionTaskBox}>
                  <div style={s.actionTaskHeader}>
                    <span style={{ fontSize: 14, fontWeight: 'bold', color: '#1F2937' }}>🕙 提醒媽媽食營養補充品</span>
                    <span style={{ fontSize: 11, fontWeight: 'bold', color: '#FF4081' }}>+15 XP ⚡ | +5 🪙</span>
                  </div>
                  <button style={{ ...s.actionTaskBtn, backgroundColor: isSupplementDone ? '#9CA3AF' : '#FF4081' }} disabled={isSupplementDone} onClick={() => { if (!isSupplementDone) { addReward(15, 5); setIsSupplementDone(true); } }}>
                    {isSupplementDone ? '已完成 ✅' : '我已提醒並準備好 💊'}
                  </button>
                </div>
                <button style={s.cancelBtn} onClick={() => setActionModalVisible(false)}>← 關閉視窗</button>
              </div>
            </div>
          )}

          {weeklyModalVisible && (
            <div style={s.modalOverlay} onClick={() => setWeeklyModalVisible(false)}>
              <div style={s.weeklyCard} onClick={(e) => e.stopPropagation()}>
                <div style={s.weeklyTag}>{activeWeeklyTask.tag}</div>
                <div style={s.weeklyTitle}>{activeWeeklyTask.title}</div>
                <div style={s.warningBox}>
                  <div style={{ fontSize: 14, fontWeight: 'bold', color: '#D97706', marginBottom: 6 }}>{activeWeeklyTask.warningTitle}</div>
                  <div style={{ fontSize: 13, color: '#B45309', lineHeight: '20px' }}>{activeWeeklyTask.warningContent}</div>
                </div>
                <button style={{ ...s.completeTaskBtn, backgroundColor: isWeeklyTaskCompleted ? '#9CA3AF' : '#FFB800' }} disabled={isWeeklyTaskCompleted} onClick={() => { if (!isWeeklyTaskCompleted) { addReward(40, 25); setIsWeeklyTaskCompleted(true); } }}>
                  {isWeeklyTaskCompleted ? '已完成 ✅ (+40 XP)' : activeWeeklyTask.buttonText}
                </button>
                <button style={s.cancelBtn} onClick={() => setWeeklyModalVisible(false)}>← 關閉視窗</button>
              </div>
            </div>
          )}

          {bookModalVisible && (
            <div style={s.modalOverlay} onClick={() => setBookModalVisible(false)}>
              <div style={s.weeklyCard} onClick={(e) => e.stopPropagation()}>
                <div style={s.knowledgeTitle}>📚 孕期知識庫</div>
                <div style={{ width: '100%', maxHeight: '52vh', overflowY: 'auto', textAlign: 'left', margin: '10px 0' }}>
                  {allKnowledgeList.map((item, idx) => (
                    <div key={idx} style={s.historyItemBox}>
                      <div style={{ fontSize: 15, fontWeight: 'bold', color: '#00A8CC', marginBottom: 6 }}>{item.title}</div>
                      <div style={{ fontSize: 13, color: '#4B5563', lineHeight: '20px' }}>{item.content}</div>
                    </div>
                  ))}
                </div>
                <button style={s.actionBtn} onClick={() => setBookModalVisible(false)}>關閉重溫</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const s = {
